[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-rescue-agent"
version = "0.1.0"
description = "Deal Rescue Agent — LangGraph orchestrator: Salesforce MCP reads, web + transcript enrichment, Agentforce synthesis, StoryMyData replay."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyjwt>=2.8",          # JWT bearer assertion for Salesforce auth
    "cryptography>=42.0",  # RS256 signing for the above
]

[project.optional-dependencies]
graph = [
    "langgraph>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "langsmith>=0.1.80",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
synthesis = [
    "anthropic>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deal_rescue"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
